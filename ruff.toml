# Configuration file example:  https://docs.astral.sh/ruff/configuration/
# All settings:                https://docs.astral.sh/ruff/settings/

fix = true
preview = true

line-length = 90
indent-width = 4

target-version = "py310"

include = [
    "faststream/**/*.py",
    "tests/**/*.py",
    "docs/**/*.py",
    "benchmarks/**/*.py",
    "pyproject.toml",
]

exclude = [
    "docs/docs_src"
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[lint]
select = [
    "ALL",
]

ignore = [
    "A",
    "FA",
    "TD",
    "FIX",
    "SLOT",
    "ARG002",
    "ARG003",
    "ARG004",
    "ARG005",
    "EXE",

    "ASYNC109",
    "ANN401",
    "COM812",
    "ISC001",
    "TRY301",
    "S101",
    "SLF001",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR2004",
    "PYI036",
    "PYI051",
    "G004",

    "E501",     # line too long, handled by formatter later
    "C901",     # too complex

    # preview
    "CPY",
    "PLC2801",
    "RUF029",
    "RUF067",

    # pep8-naming
    "N817",     # CamelCase `*` imported as acronym `*`

    # FIXME pydocstyle
    "D100",     # missing docstring in public module
    "D101",
    "D102",
    "D103",
    "D104",     # missing docstring in public package
    "D105",     # missing docstring in magic methods
    "D106",     # missing docstring in public nested class
    "D107",     # missing docstring in __init__
    "DOC201",
    "DOC202",
    "DOC402",
    "DOC501",
    "DOC502",

    "FBT", # FIXME
    "BLE001", # FIXME
    "PLR0917"  # FIXME
]

[lint.per-file-ignores]
"faststream/specification/**/*.py" = [
    "ERA001",
    "N815",     # Variable `*` in class scope should not be mixedCase
]

# the schema packages import their own modules
"faststream/specification/asyncapi/{v2_6_0,v3_0_0}/**/*.py" = [
    "TID253",
]

"benchmarks/**/*.py" = [
    "T201",
    "PLR6301",
    "PLC2701",
    "TID251",
]

# FIXME
# "faststream/specification/asyncapi/**/*.py" = [
#     "ERA001",
#     "N815",     # Variable `*` in class scope should not be mixedCase
# ]

"**/fastapi/**/*.py" = [
    "N803",     # Argument name `expandMessageExamples` should be lowercase
]

"**/_compat.py" = [
    "PYI063",
    "PLW3201",
    "ARG001",   # shims mirror a third-party signature
    "PLC2701",
    "TID251",
]

"tests/**/*.py" = [
    "ANN",  # FIXME
    "S",
    "ARG001",  # a handler takes the message whether it reads it or not
    "PLR6301",
    "PLC2701",  # tests reach into faststream._internal by design
    "TID251",
    "TID253",
    "PLR0904",
    "PT030",  # FIXME
    "PLR0914",
    "PLC1901",
    "RUF045",
]

# these files mix brokers under require_* marks, and docs_src modules build a broker on import
"tests/{docs,examples}/**/*.py" = [
    "PLC0415",
]

"tests/{cli/test_publish,cli/conftest,utils/context/test_path,utils/context/test_headers}.py" = [
    "PLC0415",
]

# the driver annotation rows name the broker's own runtime objects, which are
# only importable once the package is built, so the table is filled on call
"faststream/{confluent,kafka,nats,rabbit,redis}/configs/broker.py" = [
    "PLC0415",
]

"faststream/mqtt/broker/config.py" = [
    "PLC0415",
]

"docs/*.py" = [
    "ALL",      # FIXME
]

[lint.flake8-unused-arguments]
# fakes and pass-through wrappers accept anything; a named parameter must be used
ignore-variadic-names = true

[lint.flake8-tidy-imports]
# optional dependencies, imported only where they are needed
banned-module-level-imports = [
    "yaml",
    "uvloop",
    "tomli",
    "tomllib",
    "faststream._internal.cli.supervisors.watchfiles",
    "faststream._internal.cli.utils.errors",
    # build many pydantic models on import; loaded only when a schema is generated
    "faststream.specification.asyncapi.v2_6_0",
    "faststream.specification.asyncapi.v3_0_0",
]

[lint.flake8-tidy-imports.banned-api]
"json.loads".msg = "use `faststream._internal._compat.json_loads`"
"json.dumps".msg = "use `faststream._internal._compat.json_dumps`"

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true

[lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "faststream.Header",
    "faststream.Path",
    "faststream.Depends",
    "faststream.Context",
    "faststream.Depends",
    "faststream.params.Header",
    "faststream.params.Path",
    "faststream.params.Depends",
    "faststream.params.Context",
    "faststream.params.Depends",
    "faststream._internal.fastapi.context.Context",
    "typer.Argument",
    "typer.Option",
    "pydantic.Field",
    "rocketry.args.Arg",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.datastructures.Default",
    "kafka.partitioner.default.DefaultPartitioner",
]

[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

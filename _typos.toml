# Configuration for `typos` (https://github.com/crate-ci/typos), run from .pre-commit-config.yaml.

[files]
# Generated from GitHub release notes by docs_update-release-notes.yaml, so it
# carries contributor handles verbatim (@WellFREEzZ, @RinZ27). Those are names,
# not misspellings, and new ones land with every release.
extend-exclude = ["docs/docs/en/release.md"]

[default.extend-words]
# ruff's flake8-copyright rule prefix, not a shortening of "copy".
CPY = "CPY"

name: Build Documentation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build (defaults to the current main branch)
        type: string
  release:
    types:
      - published

permissions: {}

# Serialize complete deployments, including the update to the shared mike branch.
concurrency:
  group: docs-pages-${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch_release_docs:
    name: Start docs deployment from the default branch
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs for the published tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run docs_build.yaml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" -f "release_tag=$RELEASE_TAG"

  build_docs:
    name: Build and store the versioned site
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Record the current Pages branch tip
        run: |
          base_sha=$(git rev-parse --verify refs/remotes/origin/gh-pages)
          echo "PAGES_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          set -ux
          uv pip install --system --group dev -e .
          uv pip uninstall --system email-validator # This is to fix broken link in docs

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.42.4

      - name: Build API Reference
        run: just docs-build-api

      - run: echo "VERSION=$(python3 -c 'from importlib.metadata import version; print(".".join(version("faststream").split(".")[:2]))')" >> "$GITHUB_ENV"
      - run: echo "IS_RC=$(python3 -c 'from importlib.metadata import version; print("rc" in version("faststream"))')" >> "$GITHUB_ENV"
      - run: echo "$VERSION"
      - run: echo "$IS_RC"

      - name: Configure Git user
        run: |
          git config --local user.email "faststream-actions[bot]@users.noreply.github.com"
          git config --local user.name "faststream-actions[bot]"

      # `git checkout gh-pages` below replaces the working tree, so the script
      # and the files it copies have to be taken out of it first.
      - name: Stage the SEO script
        run: cp -r docs/create_seo_files.py docs/site_root "$RUNNER_TEMP/"

      - name: Build docs
        run: |
          cd docs
          if [ "$IS_RC" == "False" ]; then
            mike deploy -F mkdocs.yml --update-aliases "$VERSION" latest
            mike set-default --allow-empty -F mkdocs.yml latest
          else
            mike deploy -F mkdocs.yml --update-aliases "$VERSION"
          fi

          # Doc commits are large, keep only the last one. Reset to the root
          # rather than `HEAD~N`: a hand-pushed commit would shift the count.
          git checkout gh-pages
          git reset --soft "$(git rev-list --max-parents=0 HEAD)"

      # `git checkout gh-pages` leaves behind everything the build had ignored —
      # `docs/site/`, the generated API markdown, `__pycache__`. On `gh-pages`
      # there is no `.gitignore` to keep them out of the commit.
      - name: Drop the build artifacts left over from the source checkout
        run: git clean -fdx

      - name: Add robots.txt, root sitemap.xml and archive markers
        run: python3 "$RUNNER_TEMP/create_seo_files.py" . "$RUNNER_TEMP/site_root"

      - name: Commit and export the site
        run: |
          git add --all
          git commit --allow-empty -m "docs: deploy docs"
          mkdir "$RUNNER_TEMP/pages-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
          include-hidden-files: true

      - name: Replace the published snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push \
            --force-with-lease="refs/heads/gh-pages:$PAGES_BASE_SHA" \
            origin HEAD:refs/heads/gh-pages

  deploy_docs:
    name: Publish to GitHub Pages
    needs: build_docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Check external links

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - docs/docs/en/**/*.md
      - README.md
      - lychee.toml
      - .github/workflows/docs_links.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not a part of the `check` gate: a third-party site going down
      # is not a reason to hold a merge.
      - name: Check the links of the guides and the README
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml 'docs/docs/en/**/*.md' README.md
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
